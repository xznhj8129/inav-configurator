<!--suppress HtmlFormInputWithoutLabel -->
<div class="tab-ports toolbar_fixed_bottom">
    <div class="content_wrapper">
        <div class="tab_title" data-i18n="tabPorts">Ports</div>
        <div class="require-support">
            <div class="note spacebottom">
                <div class="note_spacer">
                    <p data-i18n="portsHelp"></p>
                </div>
            </div>
            <table class="ports spacebottom">
                <thead>
                    <tr>
                        <td i18n="portsColumnPort"></td>
                        <td i18n="portsColumnFunction"></td>
                        <td i18n="portsColumnType"></td>
                        <td i18n="portsColumnBaudrate"></td>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
            <div class="clear-both"></div>
        </div>
        <div class="note require-upgrade">
            <div class="note_spacer">
                <p data-i18n="portsFirmwareUpgradeRequired"></p>
            </div>
        </div>
    </div>
    <div class="content_toolbar">
        <div class="btn save_btn">
            <a class="save" href="#" data-i18n="configurationButtonSave"></a>
        </div>
    </div>
</div>
<div id="tab-ports-templates">
    <table class="ports">
        <thead>
        </thead>
        <tbody>
            <tr class="portConfiguration">
                <td class="identifierCell">
                    <p><div class="identifier"/> <div class="softSerialWarning"><img src="./images/icons/cf_icon_armed_active.svg" height="16" width="16" data-i18n_title="softSerialWarning"/></div></p>
                </td>
                <td><select class="port-function"></select></td>
                <td><select class="port-type"></select></td>
                <td><select class="port-baud"></select></td>
            </tr>
        </tbody>
    </table>
</div>

<div id="mspWarningContent" class="is-hidden">
    <p data-i18n="portsMSPWarning"></p>
</div>
